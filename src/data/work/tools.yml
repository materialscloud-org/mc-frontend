menu:
  main_tools:
    - link: https://qeinputgenerator.materialscloud.io
      title: Quantum ESPRESSO input generator and structure visualizer
      authors: Kristjan Eimre, Jusong Yu, Gabriel M. Nascimento, Elsa Passaro, Sebastiaan P. Huber, Giovanni Pizzi, Nicola Marzari
      description: |
        A tool to generate the input file of the Quantum ESPRESSO PWscf code and to visualize the corresponding structure.
      logo: qe-logo.png

    - link: https://seekpath.materialscloud.io
      title: "SeeK-path: the k-path finder and visualizer"
      authors: Yoyo Hinuma, Giovanni Pizzi, Yu Kumagai, Fumiyasu Oba, Isao Tanaka
      description: |
        A k-path finder that provides band paths compatible with space group symmetry, and an interactive 3D visualizer.
      logo: seekpath.png

    - link: https://optimadeclient.materialscloud.io
      title: "OPTIMADE-Client"
      authors: Bud Macaulay
      description: |
        A friendly client to search through materials databases and other implementations exposing an OPTIMADE RESTful API.
      logo: optimade.png

    - link: https://interactivephonon.materialscloud.io
      title: Interactive phonon visualizer
      authors: Snehal Kumbhar, Giovanni Pizzi, Thibault Sohier, Henrique Miranda
      description: |
        A tool for the interactive visualization and inspection of lattice vibrations.
      logo: interactivephonon.png

    - link: https://shiftml.materialscloud.io/
      title: "ShiftML: chemical shifts in molecular crystals by machine learning"
      authors: Matthias Kellner, Jacob B. Holmes, Ruben Rodriguez-Madrid, Florian Viscosi, Yuxuan Zhang, Lyndon Emsley, and Michele Ceriotti
      description: |
        A machine learning model to predict the isotropic chemical shielding of molecular crystals containing H, C, N, O, S, F, P, Cl, Na, Ca,
        Mg and K, including the uncertainty of the prediction, and an interactive 3D visualiser.
      logo: shiftml.png

  external_tools:
    - link: ml-layer-finder
      title: Machine-learning accelerated identification of exfoliable two-dimensional materials
      authors: Mohammad Tohidi Vahdat, Kumar Agrawal Varoon, Giovanni Pizzi
      description: >
        This tool allows users to upload the bulk crystal structure in several standard formats (or to choose from a few examples),
        and then layered structures are identified based on geometrical criteria. Finally, after generating feature vectors
        representing the crystal structure, the tool uses a machine learning model to see if the crystal structure can be exfoliated
        or have high binding energy.
      descriptionExt: |
        <p>
          The output page includes relevant information on the structure (interactive visualizations of the bulk multilayer) and whether the structure is suitable for exfoliation based on the geometrical criteria. If yes, the corresponding two-dimensional layers are displayed. In addition, the machine-learning model is run to predict whether the structure might actually have a low binding energy, and the results are displayed.
        </p>

        <p class="py-2">
          <strong>Notes:</strong> The tool computes representative feature vectors of the crystal structure in real time, and this step might take some time. The tool considers two atoms A and B bonded if their distance is smaller than rA + rB + Δ, where rA and rB are the corresponding van der Waals radii from S. Alvarez, <em>A cartography of the van der Waals territories</em>, Dalton Trans. 42, 8617–8636 (2013). For Δ, we consider five equally spaced values between 1.1 Å and 1.5 Å to account for possible uncertainties in the van der Waals radii.
        </p>

        <p>
          <strong>How to cite</strong>
        </p>

        <p>
          If you use this tool, please cite the following work:
        </p>

        <ul class="">
          <li class="py-1">G. Pizzi, S. Milana, A. C. Ferrari, N. Marzari, M. Gibertini, <em>Shear and Breathing Modes of Layered Materials</em>, ACS Nano (2021), <a href="doi.org/10.1021/acsnano.0c10672">doi:10.1021/acsnano.0c10672</a>.</li>
          <li>You might also want to cite the spglib, ASE and pymatgen libraries that are used internally by the tool.</li>
        </ul>
      logo: ML-layer-finder-logo.png
      dockerhubURL: https://hub.docker.com/r/giovannipizzi/ml-layer-finder-tool
      dockerhubIMAGE: giovannipizzi/ml-layer-finder-tool:26.05.0
      externalWebURL: https://materialscloud-ml-layer-finder-tool.onrender.com/
      sourceCodeURL: https://github.com/psi-lms/tool-ml-layer-finder

    - link: fandiagrams
      title: "Fan diagrams and optically-active modes of layered materials"
      authors: G. Pizzi, S. Milana, A. C. Ferrari, N. Marzari, M. Gibertini
      description: >
        A tool to upload the bulk crystal structure of a layered material and determine the symmetry of the inter-layer force-constant
        matrices and the corresponding optical-activity fan diagram.
      descriptionExt: |
        <p>
          This tool allows users to upload the bulk crystal structure of a layered
          material in a number of common formats (or to choose from a few examples)
          and, after detection of bonds and of 2D layers, it determines the symmetry
          of the inter-layer force-constant matrices and the corresponding
          optical-activity fan diagram.
        </p>

        <p>
          The output page that is displayed includes relevant information on the
          structure (interactive visualizations of the bulk multilayer and of each
          layer, information on the coincidence operation and of the symmetry
          properties of the multilayer), and shows the independent components of the
          force-constant matrices.
        </p>

        <p>
          In input, a skin factor parameter <i>f</i> can also be selected to tune the
          bond-detection algorithm.
        </p>

      logo: layer-raman.png
      dockerhubURL: https://hub.docker.com/r/giovannipizzi/layer-raman-ir-tool
      dockerhubIMAGE: giovannipizzi/layer-raman-ir-tool:21.11.0
      externalWebURL: https://materialscloud-layer-raman-ir-tool.onrender.com/
      sourceCodeURL: https://github.com/psi-lms/tool-layer-raman-ir

